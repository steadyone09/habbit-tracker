<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>개인 습관 트래커</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      CheckCircle2, Circle, Flame, TrendingUp, BarChart3, 
      LogOut, Plus, Trash2, Users, Calendar, ArrowLeft, ArrowRight,
      Activity, Target, ShieldCheck, Loader2, AlertCircle, X, XCircle,
      Tags, Edit3, Save, ChevronLeft, ChevronRight, Award, PieChart, Layers
    } from 'https://esm.sh/lucide-react@0.294.0?deps=react@18.2.0';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.0';

    // [백엔드 연동] 공식 Supabase SDK 설정
    const SUPABASE_URL = 'https://scqkzxkhxqccusvvptag.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_jPJXQr3KZt507QSjjgII_w_-cxMaO33';
    const ADMIN_CODE = 'ADMIN2026';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const formatDate = (date) => {
      const d = new Date(date);
      const month = '' + (d.getMonth() + 1);
      const day = '' + d.getDate();
      const year = d.getFullYear();
      return [year, month.padStart(2, '0'), day.padStart(2, '0')].join('-');
    };

    const calculateStreak = (habitId, logs, checkType, todayDate) => {
      let streak = 0;
      let currentDate = new Date(todayDate);

      while (true) {
        const dateStr = formatDate(currentDate);
        const log = logs.find(l => l.habit_id === habitId && l.date === dateStr);
        
        const isCompleted = log && (
          (checkType === 'boolean' && log.is_completed) || 
          (checkType === 'numeric' && log.numeric_value > 0)
        );

        if (isCompleted) {
          streak++;
          currentDate.setDate(currentDate.getDate() - 1);
        } else {
          if (streak === 0 && dateStr === todayDate) {
             currentDate.setDate(currentDate.getDate() - 1);
             continue;
          }
          break;
        }
      }
      return streak;
    };

    const calculateWeeklyRate = (habitId, logs, checkType, todayDate) => {
      let successes = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(todayDate);
        d.setDate(d.getDate() - i);
        const dateStr = formatDate(d);
        const log = logs.find(l => l.habit_id === habitId && l.date === dateStr);
        
        if (log && ((checkType === 'boolean' && log.is_completed) || (checkType === 'numeric' && log.numeric_value > 0))) {
          successes++;
        }
      }
      return Math.round((successes / 7) * 100);
    };

    const useSupabaseData = () => {
      const [users, setUsers] = useState([]);
      const [habits, setHabits] = useState([]);
      const [habitLogs, setHabitLogs] = useState([]);
      const [categories, setCategories] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');

      const showError = (msg) => {
        setErrorMsg(msg);
        setTimeout(() => setErrorMsg(''), 5000); 
      };

      const fetchAllData = async () => {
        setIsLoading(true);
        try {
          const [usersRes, habitsRes, logsRes, catRes] = await Promise.all([
            supabase.from('users').select('*'),
            supabase.from('habits').select('*'),
            supabase.from('habit_logs').select('*'),
            supabase.from('categories').select('*')
          ]);

          if (usersRes.error) throw usersRes.error;
          if (habitsRes.error) throw habitsRes.error;
          if (logsRes.error) throw logsRes.error;
          // categories 테이블이 아직 없거나 오류가 나도 화면을 표시할 수 있게 옵셔널 처리
          if (catRes.error && catRes.error.code !== '42P01') { 
            console.warn("카테고리 로딩 경고:", catRes.error);
          }

          setUsers(usersRes.data || []);
          setHabits(habitsRes.data || []);
          setHabitLogs(logsRes.data || []);
          setCategories(catRes.data || []);
        } catch (err) {
          console.error("데이터 로드 실패:", err);
          showError("데이터를 불러오는데 실패했습니다: " + err.message);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchAllData();
      }, []);

      const api = {
        addUser: async (user_code) => {
          const newUser = { user_code };
          const tempUser = { id: 'temp-' + Date.now(), user_code, created_at: new Date().toISOString() };
          setUsers(prev => [...prev, tempUser]); 
          
          const { data, error } = await supabase.from('users').insert([newUser]).select();
          if (error) { showError('사용자 생성 중 오류: ' + error.message); fetchAllData(); }
          else if (data && data.length > 0) setUsers(prev => prev.map(u => u.user_code === user_code ? data[0] : u));
        },
        deleteUser: async (user_code) => {
          setUsers(prev => prev.filter(u => u.user_code !== user_code));
          setHabits(prev => prev.filter(h => h.user_code !== user_code));
          const { error } = await supabase.from('users').delete().eq('user_code', user_code);
          if (error) { showError('사용자 삭제 중 오류: ' + error.message); fetchAllData(); }
        },
        addHabit: async (habit) => {
          const { data, error } = await supabase.from('habits').insert([habit]).select();
          if (error) showError('습관 생성 오류: ' + error.message);
          else if (data && data.length > 0) setHabits(prev => [...prev, data[0]]);
        },
        deleteHabit: async (habitId) => {
          setHabits(prev => prev.filter(h => h.id !== habitId));
          const { error } = await supabase.from('habits').delete().eq('id', habitId);
          if (error) { showError('습관 삭제 오류: ' + error.message); fetchAllData(); }
        },
        upsertLog: async (logData) => {
          const existing = habitLogs.find(l => l.habit_id === logData.habit_id && l.date === logData.date);
          if (existing) {
            setHabitLogs(prev => prev.map(l => l.id === existing.id ? { ...l, is_completed: logData.is_completed, numeric_value: logData.numeric_value } : l));
            const { error } = await supabase.from('habit_logs').update({ is_completed: logData.is_completed, numeric_value: logData.numeric_value }).eq('id', existing.id);
            if (error) { showError('기록 업데이트 오류: ' + error.message); fetchAllData(); }
          } else {
            const tempLog = { id: 'temp-' + Date.now(), ...logData, created_at: new Date().toISOString() };
            setHabitLogs(prev => [...prev, tempLog]);
            const { data, error } = await supabase.from('habit_logs').insert([logData]).select();
            if (error) { showError('기록 추가 오류: ' + error.message); setHabitLogs(prev => prev.filter(l => l.id !== tempLog.id)); }
            else if (data && data.length > 0) setHabitLogs(prev => prev.map(l => l.id === tempLog.id ? data[0] : l)); 
          }
        },
        deleteLog: async (habit_id, date) => {
          const existing = habitLogs.find(l => l.habit_id === habit_id && l.date === date);
          if (existing) {
            setHabitLogs(prev => prev.filter(l => l.id !== existing.id));
            const { error } = await supabase.from('habit_logs').delete().eq('id', existing.id);
            if (error) { showError('기록 삭제 오류: ' + error.message); fetchAllData(); }
          }
        },
        addCategory: async (name) => {
          const tempId = 'temp-cat-' + Date.now();
          setCategories(prev => [...prev, { id: tempId, name }]);
          
          const { data, error } = await supabase.from('categories').insert([{ name }]).select();
          if (error) { showError('카테고리 저장 오류: ' + error.message); fetchAllData(); } 
          else if (data && data.length > 0) setCategories(prev => prev.map(c => c.id === tempId ? data[0] : c));
        },
        deleteCategory: async (id) => {
          setCategories(prev => prev.filter(c => c.id !== id));
          const { error } = await supabase.from('categories').delete().eq('id', id);
          if (error) { showError('카테고리 삭제 오류: ' + error.message); fetchAllData(); }
        }
      };

      return { users, habits, habitLogs, categories, api, isLoading, fetchAllData, errorMsg, setErrorMsg };
    };

    const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 animate-in">
          <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl animate-slide-up">
            <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
            <p className="text-slate-600 mb-6 text-sm leading-relaxed">{message}</p>
            <div className="flex space-x-3">
              <button onClick={onCancel} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition-colors">취소</button>
              <button onClick={onConfirm} className="flex-1 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-xl font-medium transition-colors">확인</button>
            </div>
          </div>
        </div>
      );
    };

    const ErrorToast = ({ message, onClose }) => {
      if (!message) return null;
      return (
        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[150] w-full max-w-md px-4 animate-slide-up">
          <div className="bg-red-50 border border-red-200 p-4 rounded-2xl shadow-lg flex items-start space-x-3">
            <AlertCircle className="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5" />
            <p className="flex-1 text-sm text-red-700 font-medium leading-relaxed">{message}</p>
            <button onClick={onClose} className="text-red-400 hover:text-red-600"><X className="w-5 h-5" /></button>
          </div>
        </div>
      );
    };

    const AuthScreen = ({ onLogin, isAuthProcessing }) => {
      const [code, setCode] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (code.trim() === '') return setError('접속 코드를 입력해주세요.');
        await onLogin(code.trim());
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden">
          <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-200 rounded-full blur-[100px] opacity-40"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-200 rounded-full blur-[100px] opacity-40"></div>
          
          <div className="bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-xl w-full max-w-md border border-white relative z-10 animate-slide-up">
            <div className="text-center mb-8">
              <div className="bg-gradient-to-tr from-emerald-500 to-teal-400 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-emerald-200">
                <Activity className="w-8 h-8 text-white" />
              </div>
              <h1 className="text-2xl font-bold text-slate-800 tracking-tight">습관 트래커</h1>
              <p className="text-slate-500 mt-2 text-sm">개인 접속 코드 또는 관리자 코드를 입력하세요.</p>
            </div>
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <input type="text" value={code} onChange={(e) => { setCode(e.target.value); setError(''); }} placeholder="예: USER01, ADMIN2026" disabled={isAuthProcessing} className="w-full px-5 py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all uppercase disabled:bg-slate-100 disabled:text-slate-400 font-medium" />
                {error && <p className="text-red-500 text-sm mt-2 font-medium">{error}</p>}
              </div>
              <button type="submit" disabled={isAuthProcessing} className="w-full bg-slate-800 text-white font-semibold py-3.5 rounded-xl hover:bg-slate-900 transition-colors flex items-center justify-center disabled:opacity-70 disabled:cursor-not-allowed">
                {isAuthProcessing ? <Loader2 className="w-5 h-5 animate-spin mr-2" /> : null}
                {isAuthProcessing ? '동기화 중...' : '시작하기'}
              </button>
            </form>
          </div>
        </div>
      );
    };

    const UserDashboard = ({ userCode, habits, logs, categories, api, isLoading }) => {
      const [selectedDate, setSelectedDate] = useState(formatDate(new Date()));
      const [mainTab, setMainTab] = useState('daily');
      
      const [statsPeriod, setStatsPeriod] = useState('monthly');
      const [statsAnchorDate, setStatsAnchorDate] = useState(new Date());

      const [isAdding, setIsAdding] = useState(false);
      
      const defaultCategory = categories.length > 0 ? categories[0].name : '건강';
      const [newHabit, setNewHabit] = useState({ title: '', category: defaultCategory, check_type: 'boolean', unit: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [deleteModal, setDeleteModal] = useState({ isOpen: false, id: null, title: '' });

      const userHabits = habits.filter(h => h.user_code === userCode);
      const userLogs = logs.filter(l => l.user_code === userCode);

      const handleDateChange = (days) => {
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + days);
        setSelectedDate(formatDate(d));
      };

      const navigateStatsPeriod = (direction) => {
        const newDate = new Date(statsAnchorDate);
        if (statsPeriod === 'weekly') {
          newDate.setDate(newDate.getDate() + (direction * 7));
        } else if (statsPeriod === 'monthly') {
          newDate.setMonth(newDate.getMonth() + direction);
        } else if (statsPeriod === 'yearly') {
          newDate.setFullYear(newDate.getFullYear() + direction);
        }
        setStatsAnchorDate(newDate);
      };

      const getPeriodInfo = () => {
        const d = new Date(statsAnchorDate);
        if (statsPeriod === 'weekly') {
          const dayOfWeek = d.getDay();
          const start = new Date(d);
          start.setDate(d.getDate() - dayOfWeek);
          const end = new Date(start);
          end.setDate(start.getDate() + 6);
          return {
            label: `${start.getFullYear()}년 ${start.getMonth() + 1}월 ${Math.ceil(start.getDate()/7)}주차 (${start.getMonth()+1}.${start.getDate()} ~ ${end.getMonth()+1}.${end.getDate()})`,
            startDateStr: formatDate(start),
            endDateStr: formatDate(end),
            totalDays: 7
          };
        } else if (statsPeriod === 'monthly') {
          const year = d.getFullYear();
          const month = d.getMonth();
          const start = new Date(year, month, 1);
          const end = new Date(year, month + 1, 0);
          return {
            label: `${year}년 ${month + 1}월`,
            startDateStr: formatDate(start),
            endDateStr: formatDate(end),
            totalDays: end.getDate()
          };
        } else {
          const year = d.getFullYear();
          const start = new Date(year, 0, 1);
          const end = new Date(year, 11, 31);
          const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
          return {
            label: `${year}년 전체`,
            startDateStr: formatDate(start),
            endDateStr: formatDate(end),
            totalDays: isLeapYear ? 366 : 365
          };
        }
      };

      const handleAddHabit = async (e) => {
        e.preventDefault();
        if (!newHabit.title) return;
        setIsSubmitting(true);
        await api.addHabit({ ...newHabit, user_code: userCode });
        setIsSubmitting(false);
        setIsAdding(false);
        setNewHabit({ title: '', category: categories.length > 0 ? categories[0].name : '건강', check_type: 'boolean', unit: '' });
      };

      const executeDeleteHabit = async () => {
        if (deleteModal.id) {
          await api.deleteHabit(deleteModal.id);
          setDeleteModal({ isOpen: false, id: null, title: '' });
        }
      };

      const setBooleanLog = (habitId, newState, currentState) => {
        if (newState === currentState) {
          api.deleteLog(habitId, selectedDate);
        } else {
          api.upsertLog({ habit_id: habitId, user_code: userCode, date: selectedDate, is_completed: newState === 'O', numeric_value: null });
        }
      };

      const updateNumericLog = (habitId, value) => {
        const num = parseFloat(value);
        api.upsertLog({ habit_id: habitId, user_code: userCode, date: selectedDate, is_completed: num > 0, numeric_value: isNaN(num) ? 0 : num });
      };

      if (isLoading) {
        return (
          <div className="flex flex-col items-center justify-center py-20 text-emerald-600">
            <Loader2 className="w-10 h-10 animate-spin mb-4" />
            <p className="font-medium text-slate-600">데이터를 불러오는 중입니다...</p>
          </div>
        );
      }

      const totalCompletionsThisWeek = userHabits.reduce((acc, habit) => acc + calculateWeeklyRate(habit.id, logs, habit.check_type, selectedDate), 0) / (userHabits.length || 1);
      
      const activeStreaks = userHabits
        .map(h => ({ ...h, streak: calculateStreak(h.id, logs, h.check_type, formatDate(new Date())) }))
        .filter(h => h.streak >= 2)
        .sort((a, b) => b.streak - a.streak);

      const periodInfo = getPeriodInfo();

      return (
        <div className="max-w-7xl mx-auto pb-20 animate-in">
          <ConfirmModal 
            isOpen={deleteModal.isOpen} 
            title={`'${deleteModal.title}' 삭제`}
            message="이 습관과 관련된 모든 기록이 영구 삭제됩니다. 진행하시겠습니까?"
            onCancel={() => setDeleteModal({ isOpen: false, id: null, title: '' })}
            onConfirm={executeDeleteHabit}
          />

          <div className="flex justify-center mb-8">
            <div className="bg-slate-200/60 p-1.5 rounded-2xl inline-flex w-full sm:w-auto shadow-inner">
              <button onClick={() => setMainTab('daily')} className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center transition-all ${mainTab === 'daily' ? 'bg-white text-emerald-700 shadow-md' : 'text-slate-600 hover:text-slate-900'}`}>
                <Target className="w-4.5 h-4.5 mr-2" /> 일일 체크 대시보드
              </button>
              <button onClick={() => setMainTab('stats')} className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center transition-all ${mainTab === 'stats' ? 'bg-white text-emerald-700 shadow-md' : 'text-slate-600 hover:text-slate-900'}`}>
                <BarChart3 className="w-4.5 h-4.5 mr-2" /> 기간별 분석 리포트 (주/월/연)
              </button>
            </div>
          </div>

          {mainTab === 'daily' ? (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-8 space-y-6">
                <div className="flex items-center justify-between bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                  <button onClick={() => handleDateChange(-1)} className="p-2.5 hover:bg-slate-100 rounded-xl text-slate-600 transition-colors"><ArrowLeft className="w-5 h-5" /></button>
                  <div className="flex items-center space-x-2 font-bold text-lg text-slate-800">
                    <Calendar className="w-5 h-5 text-emerald-600" />
                    <span>{selectedDate === formatDate(new Date()) ? '오늘의 기록' : selectedDate}</span>
                  </div>
                  <button onClick={() => handleDateChange(1)} disabled={selectedDate === formatDate(new Date())} className={`p-2.5 rounded-xl transition-colors ${selectedDate === formatDate(new Date()) ? 'opacity-30 cursor-not-allowed' : 'hover:bg-slate-100 text-slate-600'}`}><ArrowRight className="w-5 h-5" /></button>
                </div>

                <div className="space-y-4">
                  {userHabits.length === 0 ? (
                    <div className="text-center py-16 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                      <Target className="w-12 h-12 text-slate-300 mx-auto mb-4" />
                      <p className="text-slate-500 font-medium mb-4">등록된 습관이 없습니다.<br/>새로운 도전을 시작해보세요!</p>
                      <button onClick={() => setIsAdding(true)} className="px-6 py-2.5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 transition-colors shadow-sm">습관 추가하기</button>
                    </div>
                  ) : (
                    userHabits.map(habit => {
                      const todayLog = logs.find(l => l.habit_id === habit.id && l.date === selectedDate);
                      const isCompleted = todayLog ? (habit.check_type === 'boolean' ? todayLog.is_completed : todayLog.numeric_value > 0) : false;
                      const booleanState = todayLog && habit.check_type === 'boolean' ? (todayLog.is_completed ? 'O' : 'X') : 'NONE';
                      const numValue = todayLog && todayLog.numeric_value !== null && todayLog.numeric_value !== undefined ? todayLog.numeric_value : '';
                      const streak = calculateStreak(habit.id, logs, habit.check_type, formatDate(new Date()));
                      const weeklyRate = calculateWeeklyRate(habit.id, logs, habit.check_type, selectedDate);

                      let borderClass = 'border-l-slate-200 hover:border-l-slate-300';
                      if (habit.check_type === 'boolean') {
                        if (booleanState === 'O') borderClass = 'border-l-emerald-500 shadow-md transform scale-[1.01]';
                        if (booleanState === 'X') borderClass = 'border-l-red-500 shadow-sm';
                      } else {
                        if (isCompleted) borderClass = 'border-l-emerald-500 shadow-md transform scale-[1.01]';
                      }

                      return (
                        <div key={habit.id} className={`bg-white p-5 rounded-2xl shadow-sm border-l-[5px] transition-all duration-300 ${borderClass}`}>

                      <div className="w-full h-2 bg-slate-700 rounded-full mt-3 overflow-hidden">
                        <div className="h-full bg-emerald-400 transition-all duration-1000" style={{ width: `${isNaN(totalCompletionsThisWeek) ? 0 : totalCompletionsThisWeek}%` }}></div>

                </div>

                <div className="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-end">
                  <button onClick={() => navigateStatsPeriod(-1)} className="p-2 hover:bg-slate-100 rounded-xl text-slate-600 transition-colors"><ChevronLeft className="w-5 h-5" /></button>
                  <span className="font-bold text-base md:text-lg text-slate-800 flex items-center">
                    <Calendar className="w-5 h-5 mr-2 text-emerald-600" /> {periodInfo.label}

                </div>
              </div>

              {userHabits.length === 0 ? (
                <div className="text-center py-20 bg-white rounded-3xl border border-slate-100">
                  <PieChart className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                  <p className="text-slate-500 font-medium">분석할 습관 데이터가 없습니다.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {userHabits.map(habit => {
                    const filteredLogs = userLogs.filter(l => 
                      l.habit_id === habit.id && 
                      l.date >= periodInfo.startDateStr && 
                      l.date <= periodInfo.endDateStr
                    );

                    const oCount = filteredLogs.filter(l => l.is_completed === true && l.numeric_value === null).length;
                    const xCount = filteredLogs.filter(l => l.is_completed === false && l.numeric_value === null).length;
                    const numericTotal = habit.check_type === 'numeric' 
                      ? filteredLogs.reduce((acc, curr) => acc + (parseFloat(curr.numeric_value) || 0), 0)
                      : 0;
                    
                    const loggedDays = filteredLogs.length;
                    const achievementRate = habit.check_type === 'boolean'
                      ? Math.round((oCount / (periodInfo.totalDays || 1)) * 100)
                      : Math.round((filteredLogs.filter(l => l.numeric_value > 0).length / (periodInfo.totalDays || 1)) * 100);

                    return (
                      <div key={habit.id} className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-5 hover:shadow-md transition-all">

                            <span className="text-xs font-bold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md mb-2 inline-block">{habit.category}</span>
                            <h3 className="text-xl font-bold text-slate-800">{habit.title}</h3>
                          </div>
                          <div className="bg-emerald-50 p-2.5 rounded-2xl text-emerald-600 font-extrabold text-sm">
                            {achievementRate}% 달성
                          </div>

                        <div>
                          <div className="flex justify-between text-xs font-medium text-slate-400 mb-1.5">
                            <span>기간 달성률</span>

                          <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">

                                <p className="text-2xl font-black text-emerald-800">{oCount}<span className="text-xs font-normal text-slate-500 ml-1">회</span></p>

                                <p className="text-xs text-red-700 font-semibold mb-1 flex items-center">

                                <p className="text-2xl font-black text-red-800">{xCount}<span className="text-xs font-normal text-slate-500 ml-1">회</span></p>
                              </div>

                                <p className="text-2xl font-black text-blue-800">{numericTotal.toLocaleString()}<span className="text-xs font-normal text-slate-500 ml-1">{habit.unit}</span></p>

                                <p className="text-xs text-indigo-700 font-semibold mb-1 flex items-center">

                                </p>
                                <p className="text-2xl font-black text-indigo-800">
                                  {loggedDays > 0 ? (numericTotal / loggedDays).toFixed(1) : 0}
                                  <span className="text-xs font-normal text-slate-500 ml-1">{habit.unit}</span>
                                </p>
                              </div>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const AdminDashboard = ({ data, api, isLoading }) => {
      const { users, habits, habitLogs, categories } = data;
      const [activeTab, setActiveTab] = useState('overview');
      const [newUserCode, setNewUserCode] = useState('');
      const [assignForm, setAssignForm] = useState({ user_code: '', title: '', category: categories.length > 0 ? categories[0].name : '공통', check_type: 'boolean', unit: '' });
      const [newCategory, setNewCategory] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [deleteModal, setDeleteModal] = useState({ isOpen: false, type: '', id: null, title: '' });

      const handleCreateUser = async (e) => {
        e.preventDefault();
        if (!newUserCode) return;
        setIsProcessing(true);
        await api.addUser(newUserCode.toUpperCase());
        setNewUserCode('');
        setIsProcessing(false);
      };

      const handleAssignHabit = async (e) => {
        e.preventDefault();
        if (!assignForm.user_code || !assignForm.title) return;
        setIsProcessing(true);
        await api.addHabit({ ...assignForm });
        setAssignForm({ ...assignForm, title: '', unit: '' });
        setIsProcessing(false);
      };

      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCategory.trim()) return;
        setIsProcessing(true);
        await api.addCategory(newCategory.trim());
        setNewCategory('');
        setIsProcessing(false);
      };

      const executeDelete = async () => {
        if (deleteModal.type === 'user') {
          await api.deleteUser(deleteModal.id);
        } else if (deleteModal.type === 'category') {
          await api.deleteCategory(deleteModal.id);
        }
        setDeleteModal({ isOpen: false, type: '', id: null, title: '' });
      };

      if (isLoading) {
        return (
          <div className="flex flex-col items-center justify-center py-32 text-slate-600">
            <Loader2 className="w-10 h-10 animate-spin mb-4" />
            <p className="font-bold">Supabase에서 전체 데이터를 가져오는 중...</p>
          </div>
        );
      }

      return (
        <div className="max-w-5xl mx-auto pb-20 animate-in">
          <ConfirmModal 
            isOpen={deleteModal.isOpen} 
            title={deleteModal.type === 'user' ? "사용자 영구 삭제" : "카테고리 삭제"}
            message={deleteModal.type === 'user' ? `'${deleteModal.title}' 유저와 관련된 모든 데이터가 영구 삭제됩니다.` : `'${deleteModal.title}' 카테고리를 삭제하시겠습니까?`}
            onCancel={() => setDeleteModal({ isOpen: false, type: '', id: null, title: '' })}
            onConfirm={executeDelete}
          />

          <div className="flex space-x-2 bg-slate-200/50 p-1.5 rounded-2xl mb-8 overflow-x-auto">
            <button onClick={() => setActiveTab('overview')} className={`whitespace-nowrap flex-1 px-4 py-2.5 text-sm font-bold rounded-xl transition-all ${activeTab === 'overview' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>전체 현황</button>
            <button onClick={() => setActiveTab('users')} className={`whitespace-nowrap flex-1 px-4 py-2.5 text-sm font-bold rounded-xl transition-all ${activeTab === 'users' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>계정 관리</button>
            <button onClick={() => setActiveTab('categories')} className={`whitespace-nowrap flex-1 px-4 py-2.5 text-sm font-bold rounded-xl transition-all ${activeTab === 'categories' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>카테고리 관리</button>
            <button onClick={() => setActiveTab('assign')} className={`whitespace-nowrap flex-1 px-4 py-2.5 text-sm font-bold rounded-xl transition-all ${activeTab === 'assign' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}>습관 일괄 부여</button>
          </div>

          {activeTab === 'overview' && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center justify-between">
                  <div><p className="text-sm text-slate-500 font-medium mb-1">총 등록 사용자</p><h3 className="text-4xl font-bold text-slate-800">{users.length}</h3></div>

                </div>
                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center justify-between">
                  <div><p className="text-sm text-slate-500 font-medium mb-1">총 생성된 습관</p><h3 className="text-4xl font-bold text-slate-800">{habits.length}</h3></div>
                  <div className="p-4 bg-emerald-50 rounded-2xl text-emerald-500"><Target className="w-8 h-8"/></div>
                </div>
                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center justify-between">
                  <div><p className="text-sm text-slate-500 font-medium mb-1">전체 누적 기록</p><h3 className="text-4xl font-bold text-slate-800">{habitLogs.length}</h3></div>
                  <div className="p-4 bg-orange-50 rounded-2xl text-orange-500"><Activity className="w-8 h-8"/></div>
                </div>

                        <th className="px-6 py-4 font-semibold text-slate-700">관리 중인 습관</th>
                        <th className="px-6 py-4 font-semibold text-slate-700">최근 접속/기록</th>

                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {users.length === 0 ? <tr><td colSpan="3" className="px-6 py-8 text-center text-slate-400">데이터가 없습니다.</td></tr> : users.map(user => {
                        const userHabitsCount = habits.filter(h => h.user_code === user.user_code).length;
                        const userLogs = habitLogs.filter(l => l.user_code === user.user_code).sort((a,b) => new Date(b.date) - new Date(a.date));
                        const lastActive = userLogs.length > 0 ? userLogs[0].date : '기록 없음';
                        return (
                          <tr key={user.id} className="hover:bg-slate-50/50 transition-colors">
                            <td className="px-6 py-4 font-bold text-slate-800">{user.user_code}</td>
                            <td className="px-6 py-4"><span className="px-2.5 py-1 bg-slate-100 rounded-md font-medium">{userHabitsCount}개</span></td>
                            <td className="px-6 py-4 text-slate-500">{lastActive}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'users' && (
            <div className="space-y-6">
              <form onSubmit={handleCreateUser} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col sm:flex-row items-end gap-4">
                <div className="flex-1 w-full">
                  <label className="block text-sm font-bold text-slate-700 mb-2">새 사용자 코드 발급</label>
                  <input type="text" value={newUserCode} onChange={e => setNewUserCode(e.target.value)} placeholder="예: NEWUSER_01" className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-slate-800 transition-all uppercase font-medium" required />
                </div>
                <button type="submit" disabled={isProcessing} className="w-full sm:w-auto px-8 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-900 transition-colors disabled:opacity-70 flex items-center justify-center">
                  {isProcessing ? <Loader2 className="w-5 h-5 animate-spin mr-2" /> : <Plus className="w-5 h-5 mr-1" />} 생성
                </button>
              </form>

              <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
                <h3 className="font-bold text-slate-800 mb-5">등록된 사용자 명단</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {users.map(user => (
                    <div key={user.id} className="flex items-center justify-between p-4 border border-slate-200 rounded-2xl bg-slate-50 hover:bg-white hover:shadow-sm transition-all group">
                      <span className="font-bold text-slate-700">{user.user_code}</span>
                      <button onClick={() => setDeleteModal({ isOpen: true, type: 'user', id: user.user_code, title: user.user_code })} className="text-slate-300 hover:text-red-500 p-2 rounded-xl hover:bg-red-50 transition-colors opacity-100 sm:opacity-0 group-hover:opacity-100">
                        <Trash2 className="w-4.5 h-4.5" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {activeTab === 'categories' && (
            <div className="space-y-6">
              <form onSubmit={handleAddCategory} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col sm:flex-row items-end gap-4">
                <div className="flex-1 w-full">
                  <label className="block text-sm font-bold text-slate-700 mb-2">새 카테고리 추가</label>
                  <input type="text" value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder="예: 자기계발, 식습관" className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-slate-800 transition-all font-medium" required />
                </div>
                <button type="submit" disabled={isProcessing} className="w-full sm:w-auto px-8 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-900 transition-colors disabled:opacity-70 flex items-center justify-center">
                  {isProcessing ? <Loader2 className="w-5 h-5 animate-spin mr-2" /> : <Plus className="w-5 h-5 mr-1" />} 추가
                </button>
              </form>

              <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
                <h3 className="font-bold text-slate-800 mb-5">등록된 카테고리 명단</h3>
                <div className="flex flex-wrap gap-3">
                  {categories.length === 0 ? <p className="text-slate-400 text-sm py-4">등록된 카테고리가 없습니다.</p> : categories.map(cat => (
                    <div key={cat.id} className="flex items-center space-x-2 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
                      <Tags className="w-4 h-4 text-slate-500" />
                      <span className="font-bold text-slate-700">{cat.name}</span>
                      <button onClick={() => setDeleteModal({ isOpen: true, type: 'category', id: cat.id, title: cat.name })} className="text-slate-400 hover:text-red-500 p-1 rounded-lg hover:bg-red-50 transition-colors ml-2">
                        <X className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {activeTab === 'assign' && (
            <form onSubmit={handleAssignHabit} className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6 max-w-2xl mx-auto">
              <div className="border-b border-slate-100 pb-4 mb-4">
                <h3 className="font-bold text-xl text-slate-800">특정 사용자에게 습관 대리 부여</h3>
                <p className="text-sm text-slate-500 mt-1">관리자 권한으로 대상 유저의 리스트에 직접 미션을 추가합니다.</p>
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 mb-2">대상 사용자 선택</label>
                <select value={assignForm.user_code} onChange={e => setAssignForm({...assignForm, user_code: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white" required>
                  <option value="">-- 사용자 코드를 선택하세요 --</option>
                  {users.map(u => <option key={u.id} value={u.user_code}>{u.user_code}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 mb-2">부여할 습관 명칭</label>
                <input type="text" value={assignForm.title} onChange={e => setAssignForm({...assignForm, title: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200" placeholder="예: 관리자 특별 미션" required />
              </div>
              <div className="flex flex-col sm:flex-row gap-4">
                <div className="flex-1">
                  <label className="block text-sm font-bold text-slate-700 mb-2">카테고리</label>
                  <select value={assignForm.category} onChange={e => setAssignForm({...assignForm, category: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white">
                    {categories.length === 0 && <option value="공통">공통 (기본)</option>}
                    {categories.map(cat => <option key={cat.id} value={cat.name}>{cat.name}</option>)}
                  </select>
                </div>
                <div className="flex-1">
                  <label className="block text-sm font-bold text-slate-700 mb-2">기록 방식</label>
                  <select value={assignForm.check_type} onChange={e => setAssignForm({...assignForm, check_type: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white">
                    <option value="boolean">O/X 달성</option>
                    <option value="numeric">수치 기입</option>
                  </select>
                </div>
              </div>
              {assignForm.check_type === 'numeric' && (
                <div className="animate-in fade-in slide-in-from-top-2">
                  <label className="block text-sm font-bold text-slate-700 mb-2">단위</label>
                  <input type="text" value={assignForm.unit} onChange={e => setAssignForm({...assignForm, unit: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200" required={assignForm.check_type === 'numeric'} placeholder="예: 분, 권, 회" />
                </div>
              )}
              <div className="pt-4">
                <button type="submit" disabled={isProcessing || !assignForm.user_code} className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all flex justify-center items-center disabled:opacity-70 disabled:cursor-not-allowed">
                  {isProcessing ? <Loader2 className="w-6 h-6 animate-spin mr-2" /> : null} 강제 부여 실행
                </button>
              </div>
            </form>
          )}
        </div>
      );
    };

    const App = () => {
      const [currentUser, setCurrentUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [isAuthProcessing, setIsAuthProcessing] = useState(false);

      const { users, habits, habitLogs, categories, api, isLoading, fetchAllData, errorMsg, setErrorMsg } = useSupabaseData();

      const handleLogin = async (code) => {
        const upperCode = code.toUpperCase();
        setIsAuthProcessing(true);

        try {
          if (upperCode === ADMIN_CODE) {
            setIsAdmin(true);
            setCurrentUser(ADMIN_CODE);
          } else {
            const existingUser = users.find(u => u.user_code === upperCode);
            if (!existingUser) {
              await api.addUser(upperCode);
            }
            setIsAdmin(false);
            setCurrentUser(upperCode);
          }
        } catch (err) {
           console.error("인증 에러:", err);
           setErrorMsg("로그인 처리 중 오류가 발생했습니다.");
        } finally {
          setIsAuthProcessing(false);
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIsAdmin(false);
        fetchAllData();
      };

      const ErrorBanner = () => <ErrorToast message={errorMsg} onClose={() => setErrorMsg('')} />;

      if (!currentUser) {
        return (
          <React.Fragment>
            <ErrorBanner />
            <AuthScreen onLogin={handleLogin} isAuthProcessing={isAuthProcessing || isLoading} />
          </React.Fragment>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-emerald-200 selection:text-emerald-900">
          <ErrorBanner />
          
          <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center shadow-sm ${isAdmin ? 'bg-slate-800 text-white' : 'bg-gradient-to-br from-emerald-400 to-teal-500 text-white'}`}>
                  {isAdmin ? <ShieldCheck className="w-5 h-5" /> : <Activity className="w-5 h-5" />}
                </div>
                <span className="font-bold text-lg hidden sm:block tracking-tight">
                  {isAdmin ? '마스터 관제 센터' : 'Habit Tracker'}
                </span>
              </div>
              
              <div className="flex items-center space-x-3 sm:space-x-4">
                <div className="bg-slate-100 px-3 py-1.5 rounded-lg flex items-center border border-slate-200">
                  <span className="text-xs text-slate-500 mr-2 hidden sm:inline">접속계정:</span>
                  <span className={`text-sm font-bold ${isAdmin ? 'text-blue-600' : 'text-emerald-600'}`}>{currentUser}</span>
                </div>
                <button onClick={handleLogout} className="text-slate-400 hover:text-red-500 transition-colors p-2 rounded-xl hover:bg-red-50 flex items-center" title="로그아웃">
                  <LogOut className="w-5 h-5" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-8">
            {isAdmin ? (
              <AdminDashboard data={{users, habits, habitLogs, categories}} api={api} isLoading={isLoading} />
            ) : (
              <UserDashboard userCode={currentUser} habits={habits} logs={habitLogs} categories={categories} api={api} isLoading={isLoading} />
            )}
          </main>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
